<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarbucks Site</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Pompiere&display=swap" rel="stylesheet">
</head>
<body>
    <img class="background_image" src="./recs/logo-light.png" id="bgImage">
    <section class="header">
        <h1>Triangle Run</h1>
        
        <div class="search_container">
            <input type="text" id="item_search_input" class="search_input" placeholder="Search for items... (e.g., Vanilla)">
            <ul id="search_suggestions" class="search_suggestions_list"></ul>
        </div>
    </section>

    <section class="body" id="main-content-area">
        <button class="clear_all_button" onclick="clearAllAmounts()">Clear All Amounts (Reset to 0)</button>
    </section>
    
    <script src="script.js"></script>
    <script src="dataloader.js"></script>
</body>
</html>
